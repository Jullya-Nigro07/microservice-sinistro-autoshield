spring.application.name=sinistro

#Postgres
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.datasource.url=jdbc:postgresql://localhost:5432/sinistro_autoshield
spring.datasource.username=postgres
spring.datasource.password=admadm
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true

#Eureka
server.port=0
eureka.instance.hostname=localhost
eureka.client.service-url.defaltZone=http://localhost:8761/eureka
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

#RabbitMQ
mq.queues.enviar-status-cliente=status-sinistro
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest